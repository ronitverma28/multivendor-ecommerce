name: CI/CD Pipeline for Spring Boot Ecommerce Backend

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Run the CI job on the latest Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the project code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java 21 using the Temurin distribution
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: Cache Maven dependencies to speed up builds
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Step 4: Give executable permissions to the Maven wrapper script (mvnw)
      - name: Make mvnw executable
        run: chmod +x mvnw

      # Step 5: Build the project using Maven, skipping tests for faster CI
      - name: Build with Maven
        run: ./mvnw clean install -DskipTests

  deploy:
    # Run the CD job only after the build job succeeds, and only on push to main (not PR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Step 1: Trigger deployment on Render using the deploy hook URL
      - name: Deploy to Render
        run: |
          # Send a POST request to the Render deploy hook to trigger deployment
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
